<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latest Articles - Every Movie Plug</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg-color: #000000;
      --glass-card-bg: rgba(255, 255, 255, 0.04);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-primary: #f5f5f7;
      --text-secondary: #86868b;
      --accent: #a5b4fc;
      --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }

    body {
      font-family: var(--font-apple);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 3rem 1.5rem;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .articles-grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .article-card {
      background: var(--glass-card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .article-card:hover {
      transform: translateY(-2px);
      border-color: rgba(168, 85, 247, 0.4);
    }

    .article-date {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .article-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .article-excerpt {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
    /* Update card layout to sit side-by-side on larger screens */
.article-card {
  background: var(--glass-card-bg);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 1.25rem;
  text-decoration: none;
  color: inherit;
  transition: transform 0.3s ease, border-color 0.3s ease;
  display: flex;
  gap: 1.25rem;
  align-items: center;
}

/* 1:1 Aspect Ratio Thumbnail Styling */
.article-thumbnail {
  width: 120px;
  height: 120px;
  aspect-ratio: 1 / 1;
  flex-shrink: 0;
  border-radius: 12px;
  overflow: hidden;
  background-color: rgba(255, 255, 255, 0.05);
}

.article-thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.article-content {
  flex: 1;
}

/* Optional: Stack vertically on small mobile screens */
@media (max-width: 480px) {
  .article-card {
    flex-direction: column;
    align-items: flex-start;
  }
  .article-thumbnail {
    width: 100%;
    height: auto;
  }
}
  </style>
</head>
<body>
  <a href="/index.html" class="back-link">← Back to Home</a>
  
  <header>
    <h1>Latest Articles</h1>
    <p style="color: var(--text-secondary);">Insights, movie breakdowns, and news.</p>
  </header>

 <main class="articles-grid">
  <!-- Article 1 -->
  <a href="#" class="article-card">
    <div class="article-thumbnail">
      <img src="https://image.tmdb.org/t/p/original/2Tw4Me7P8wYNb1E0zsmm0DsHOhZ.jpg?w=300&auto=format&fit=crop&q=80" alt="Spider-Man:Brand New Day">
    </div>
    <div class="article-content">
      <div class="article-date">September 20, 2026</div>
      <h2 class="article-title">The Renaissance of the Web-Slinger</h2>
      <p class="article-excerpt">How 'Spider-Man: Brand New Day' Rewrote Box Office History</p>
    </div>
  </a>

  <!-- Article 2 -->
  <a href="#" class="article-card">
    <div class="article-thumbnail">
      <img src="articleassets/zen tom.jpg" alt="Hollywood Love Story">
    </div>
    <div class="article-content">
      <div class="article-date">September 17, 2026</div>
      <h2 class="article-title">The Love Story of Tom Holland and Zendaya.</h2>
      <p class="article-excerpt">From child prodigies to Hollywood royalty.</p>
    </div>
  </a>
</main>
</body>
</html>
