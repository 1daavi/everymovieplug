<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latest Articles - Every Movie Plug</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg-color: #000000;
      --text-primary: #f5f5f7;
      --text-secondary: #86868b;
      --accent: #a5b4fc;
      --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }

    body {
      font-family: var(--font-apple);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 3rem 1.5rem;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }

    /* X (Twitter) embeds */
    .articles-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .embed-wrap {
      width: 100%;
      max-width: 550px;
    }

    .embed-wrap .twitter-tweet {
      margin: 0 auto !important;
    }
  </style>
</head>
<body>
  <a href="/index.html" class="back-link">← Back to Home</a>

  <header>
    <h1>Latest Articles</h1>
    <p style="color: var(--text-secondary);">Insights, movie breakdowns, and news.</p>
  </header>

  <main class="articles-grid">

    <!-- Embed 1: replace the URL at the end of the <a> link with your post's URL -->
    <div class="embed-wrap">
       <blockquote class="twitter-tweet" data-theme="dark" data-dnt="true">
        <a href="https://x.com/everymovieplug/status/2106181553726292395"></a>
      </blockquote>
        </div>

    <!-- Embed 2 -->
    <div class="embed-wrap">
      <blockquote class="twitter-tweet" data-theme="dark" data-dnt="true">
        <a href="https://x.com/everymovieplug/status/2106366481265000650"></a>
      </blockquote>
    </div>

        <!-- Embed 3 -->
    <div class="embed-wrap">
      <blockquote class="twitter-tweet" data-theme="dark" data-dnt="true">
        <a href="https://x.com/everymovieplug/status/2106071386527613049"></a>
      </blockquote>
    </div>

    <!-- To add more, copy one of the .embed-wrap blocks above and paste it here -->

  </main>

  <!-- X's official script: turns each blockquote above into a full embedded post. Keep this once, at the bottom. -->
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</body>
</html>
