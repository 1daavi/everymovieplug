<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Core Page Metadata -->
  <title>Every Movie Plug — Coming Soon</title>
  <meta name="description" content="Every Movie Plug is getting a brand new look. Follow our journey on X for updates.">

  <!-- Open Graph / Facebook / WhatsApp / iMessage -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://everymovieplug.com/">
  <meta property="og:title" content="Every Movie Plug — Coming Soon">
  <meta property="og:description" content="Every Movie Plug is getting a brand new look. Follow our journey on X for updates.">
  <meta property="og:image" content="https://everymovieplug.com/og-image.jpg">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://everymovieplug.com/">
  <meta name="twitter:title" content="Every Movie Plug — Coming Soon">
  <meta name="twitter:description" content="Every Movie Plug is getting a brand new look. Follow our journey on X for updates.">
  <meta name="twitter:image" content="https://everymovieplug.com/og-image.jpg">

  <style>
    :root {
      --bg-color: #000000;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --border-color: rgba(255, 255, 255, 0.12);
      --indigo-accent: #6366f1;
      --purple-accent: #a855f7;
      --text-primary: #f5f5f7;
      --text-secondary: #86868b;
      --status-active: #34d399;
      
      /* Apple System Font Stack */
      --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-apple);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ambient Mesh Gradient Background */
    .mesh-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 25%, rgba(99, 102, 241, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 40%, rgba(30, 30, 50, 0.7) 0%, transparent 80%);
      z-index: 0;
      pointer-events: none;
    }

    /* Main Container */
    .container {
      max-width: 620px;
      width: 100%;
      position: relative;
      z-index: 1;
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Status Pill / Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      background: var(--glass-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #a5b4fc;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--status-active);
      box-shadow: 0 0 8px var(--status-active);
    }

    /* Apple-style Typography */
    h1 {
      font-size: clamp(2.4rem, 5.5vw, 4rem);
      font-weight: 600;
      line-height: 1.0625;
      letter-spacing: -0.015em;
      margin-bottom: 1.25rem;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 .highlight {
      background: linear-gradient(135deg, #a5b4fc 0%, #d8b4fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1rem;
      line-height: 1.47059;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
      font-weight: 400;
      letter-spacing: -0.022em;
    }

    /* Refined Apple-Style Button & Motion */
    .social-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.95rem 2.25rem;
      border-radius: 980px; /* Apple pill style */
      background: linear-gradient(135deg, var(--indigo-accent) 0%, var(--purple-accent) 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      cursor: pointer;
      isolation: isolate;
      
      /* Micro-smooth cubic-bezier transition */
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                  box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
    }

    /* Soft backlight glow pseudoelement */
    .social-link::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, var(--indigo-accent) 0%, var(--purple-accent) 100%);
      filter: blur(16px);
      opacity: 0.4;
      z-index: -1;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                  filter 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .social-link:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 30px rgba(168, 85, 247, 0.45);
    }

    .social-link:hover::before {
      opacity: 0.8;
      filter: blur(22px);
    }

    .social-link:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
    }

    .x-icon {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    /* Footer */
    footer {
      margin-top: 4rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <!-- Ambient Mesh Background -->
  <div class="mesh-bg" aria-hidden="true"></div>

  <!-- Primary Content Box -->
  <main class="container">
    <div class="badge">
      <span class="dot" aria-hidden="true"></span>
      We've noticed your presence
    </div>

    <h1>We’re cooking up <span class="highlight">something special</span>.</h1>

    <p>Every Movie Plug is getting a brand new look and we can't wait to share it with you. Follow our journey on X for updates and premiere announcements.</p>

    <a href="https://x.com/everymovieplug" class="social-link" target="_blank" rel="noopener noreferrer">
      <svg class="x-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      Follow on X @everymovieplug
    </a>

    <footer>
      © Every Movie Plug • Next Chapter
    </footer>
  </main>

</body>
</html>
