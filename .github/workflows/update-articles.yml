   name: Update article cards
   on:
     push:
       paths: ["articles/**", "!articles/index.html"]
     workflow_dispatch:
   jobs:
     build:
       runs-on: ubuntu-latest
       permissions:
         contents: write
       steps:
         - uses: actions/checkout@v4
         - run: node update-articles.js
         - run: node add-schema.js
         - run: |
             git config user.name "github-actions"
             git config user.email "github-actions@users.noreply.github.com"
             git add articles
             git commit -m "Add new article card" || exit 0
             git push
