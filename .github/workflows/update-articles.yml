name: Update article pages

on:
  push:
    paths:
      - "articles/**"
      - "!articles/index.html"
      - "!articles/page/**"
      - "!articles/search-index.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: node build-listings.js --only=articles
      - run: node add-author.js articles
      - run: node fix-nav.js articles
      - run: node add-schema.js
      - run: node add-adsense.js articles
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add articles
          git commit -m "Rebuild article pages" || exit 0
          git pull --rebase --autostash
          git push
