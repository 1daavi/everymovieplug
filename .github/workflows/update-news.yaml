name: Update news pages

on:
  push:
    paths:
      - "news/**"
      - "!news/index.html"
      - "!news/page/**"
      - "!news/search-index.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: node add-author.js news
      - run: node build-listings.js --only=news
      - run: node fix-nav.js news
      - run: node add-schema.js
      - run: node add-adsense.js news
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add news
          git commit -m "Rebuild news pages" || exit 0
          git pull --rebase --autostash
          git push
