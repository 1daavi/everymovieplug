name: Update sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - sitemap.xml
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # daily safety net

permissions:
  contents: write

# One sitemap run at a time. A newer run waits instead of racing the older one to push.
concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # Always build on the newest main. Other workflows (e.g. the TMDB image fetch)
            # also push, so the branch may have moved since this job started.
            git fetch origin main
            git reset --hard origin/main

            node generate-sitemap.js

            if [[ -z "$(git status --porcelain sitemap.xml)" ]]; then
              echo "Sitemap already up to date."
              exit 0
            fi

            git add sitemap.xml
            git commit -m "Update sitemap.xml"

            if git push origin HEAD:main; then
              echo "Sitemap pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected (main moved). Retrying from the latest main..."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push sitemap.xml after 5 attempts."
          exit 1
