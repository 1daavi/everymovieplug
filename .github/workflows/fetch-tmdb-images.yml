name: Fetch TMDB images

# Runs by itself whenever a post in news/ is added or changed.
# You can also run it by hand: Actions > Fetch TMDB images > Run workflow
on:
  workflow_dispatch:
  push:
    paths: ["news/**"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Download images from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/fetch_tmdb_images.py

      - name: Commit new images
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add articleassets
          if git diff --cached --quiet; then echo "No new images"; exit 0; fi
          git commit -m "Add TMDB images for news posts"
          git pull --rebase
          git push
