    /* Safety net: if promos.js is missing, has a typo, or is an older version, the page still loads normally; promos just don't show. */
    (function () {
      var E = window.EMP_PROMOS = window.EMP_PROMOS || {};

    <script>
    /* Featured banner: 5 stories from the newest articles, reshuffled every 12 hours.
       The shuffle is seeded by the current 12-hour window, so every visitor sees the same
       five stories until the window rolls over (the banner also rebuilds itself at that moment). */
    (function () {
        var POOL_SIZE = 15;          /* shuffle among the 15 newest stories */
        var COUNT = 5;               /* slides shown */
        var WINDOW_MS = 12 * 60 * 60 * 1000;
        var SLIDE_MS = 6500;         /* time per slide */

        var hero = document.getElementById("hero"), stage = document.getElementById("heroStage"), dotsEl = document.getElementById("heroDots");
        var tiles = [].slice.call(document.querySelectorAll("#tiles .tile"));
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        var slides = [], dots = [], current = 0, timer = null, boundaryTimer = null, touchX = null;

        function rng(seed) { /* mulberry32 */
            return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
        }
        function pick(windowId) {
            var pool = tiles.filter(function (t) { return t.querySelector(".tile-thumb img"); }).slice(0, POOL_SIZE);
            var rand = rng(windowId * 2654435761), a = pool.slice();
            for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; }
            return a.slice(0, COUNT);
        }

        var ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        /* ---- promo slides (promos.js, slot "newsBanner"): pinned in front of the regular stories ---- */
        var promoItems = [];
        function escHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
        /* a stand-in for a story tile, so promo slides are drawn by exactly the same code as normal slides */
        function promoTile(p) {
            var t = document.createElement("a");
            t.href = p.url;
            t.innerHTML = '<div class="tile-thumb">' + (p.image ? '<img alt="">' : "") + '</div><span class="tile-tag"></span><time class="tile-date"></time><span class="tile-title"></span><p class="tile-excerpt"></p>';
            if (p.image) t.querySelector("img").setAttribute("src", p.image);
            t.querySelector(".tile-tag").textContent = p.sponsored ? (p.badge ? "Sponsored \u00b7 " + p.badge : "Sponsored") : p.badge;
            t.querySelector(".tile-title").innerHTML = p.titleHtml || escHtml(p.title);
            t.querySelector(".tile-excerpt").textContent = p.description || "";
            t._promo = p;
            return t;
        }

        function build() {
            var windowId = Math.floor(Date.now() / WINDOW_MS), chosen = promoItems.map(promoTile).concat(pick(windowId));
            stage.innerHTML = ""; dotsEl.innerHTML = ""; slides = []; dots = []; current = 0;
            if (!chosen.length) { hero.hidden = true; return; }

            chosen.forEach(function (t, i) {
                var img = t.querySelector(".tile-thumb img"), src = img ? img.getAttribute("src") : "";
                var tag = t.querySelector(".tile-tag"), date = t.querySelector(".tile-date"), title = t.querySelector(".tile-title"), ex = t.querySelector(".tile-excerpt");

                var a = document.createElement("a");
                a.className = "hero-slide"; a.href = t.getAttribute("href");
                a.setAttribute("role", "group"); a.setAttribute("aria-roledescription", "slide");
                a.setAttribute("aria-label", (i + 1) + " of " + chosen.length);
                a.innerHTML =
                    '<div class="hero-bg" style="background-image:url(\'' + src + '\')"></div>' +
                    '<div class="hero-copy">' +
                        '<div class="hero-meta"><span class="hero-tag"></span><time class="hero-date"></time></div>' +
                        '<h2 class="hero-title"></h2><p class="hero-excerpt"></p>' +
                        '<span class="hero-cta">Read story ' + ARROW + '</span>' +
                    '</div>' +
                    '<div class="hero-thumb"><img alt="" decoding="async" loading="' + (i === 0 ? 'eager' : 'lazy') + '" src="' + src + '"></div>';
                a.querySelector(".hero-tag").textContent = tag ? tag.textContent : "News";
                var d = a.querySelector(".hero-date"); d.textContent = date ? date.textContent : ""; if (date && date.dateTime) d.dateTime = date.dateTime;
                a.querySelector(".hero-title").innerHTML = title ? title.innerHTML : "";
                a.querySelector(".hero-excerpt").textContent = ex ? ex.textContent : "";
                a.querySelector(".hero-thumb img").onerror = function () { this.remove(); };
                a.querySelector(".hero-bg").style.backgroundImage = "url('" + src + "')";
                if (t._promo) {   /* promo: its own link (new tab / rel="sponsored" when needed) and button text */
                    EMP_PROMOS.linkAttrs(a, t._promo);
                    if (t._promo.descriptionHtml) a.querySelector(".hero-excerpt").innerHTML = t._promo.descriptionHtml;   /* coloured words in the description */
                    if (t._promo.cornerLabel !== undefined && t._promo.cornerLabel !== null) a.setAttribute("data-corner", String(t._promo.cornerLabel));
                    a.querySelector(".hero-cta").innerHTML = escHtml(t._promo.cta) + " " + ARROW;
                    if (!t._promo.badge && !t._promo.sponsored) a.querySelector(".hero-tag").style.display = "none";   /* label: "" = no badge */
                    if (t._promo.sponsored) a.setAttribute("aria-label", (i + 1) + " of " + chosen.length + " (sponsored)");
                }
                a.querySelector(".hero-bg").style.backgroundImage = src ? "url('" + src.replace(/'/g, "%27") + "')" : "";
                stage.appendChild(a); slides.push(a);

                var b = document.createElement("button");
                b.type = "button"; b.className = "hero-dot"; b.setAttribute("role", "tab");
                b.setAttribute("aria-label", "Show story " + (i + 1) + ": " + (title ? title.textContent.trim() : ""));
                b.innerHTML = "<i></i>";
                b.addEventListener("click", function () { go(i, true); });
                dotsEl.appendChild(b); dots.push(b);
            });

            hero.style.setProperty("--dur", SLIDE_MS + "ms");
            hero.classList.toggle("static", reduce);
            hero.hidden = false;
            show(0); play();

            /* rebuild exactly when the next 12-hour window starts */
            clearTimeout(boundaryTimer);
            boundaryTimer = setTimeout(build, (windowId + 1) * WINDOW_MS - Date.now() + 500);
        }

        function show(n) {
            current = (n + slides.length) % slides.length;
            slides.forEach(function (s, i) { var on = i === current; s.classList.toggle("active", on); s.tabIndex = on ? 0 : -1; s.setAttribute("aria-hidden", on ? "false" : "true"); });
            dots.forEach(function (d, i) {
                var on = i === current;
                d.classList.remove("active"); void d.offsetWidth; /* restart progress animation */
                if (on) d.classList.add("active");
                d.setAttribute("aria-selected", on ? "true" : "false");
            });
            /* corner label: normal stories show the normal one; a promo slide may carry its own (data-corner) */
            if (window.EMP_PROMOS && slides[current]) EMP_PROMOS.applyLabel("newsBanner", document.querySelector("#hero .hero-label"), slides[current].hasAttribute("data-corner") ? slides[current].getAttribute("data-corner") : undefined);
        }
        function go(n, user) { show(n); if (user) play(); else schedule(); }
        function schedule() { clearTimeout(timer); if (reduce || hero.classList.contains("paused")) return; timer = setTimeout(function () { go(current + 1); }, SLIDE_MS); }
        function play() { schedule(); }

        /* pause while hovering / focusing / tab hidden, resume after */
        function pause() { hero.classList.add("paused"); clearTimeout(timer); }
        function resume() { if (hero.contains(document.activeElement) && document.activeElement.matches(":focus-visible")) return; hero.classList.remove("paused"); show(current); schedule(); }
        hero.addEventListener("mouseenter", pause); hero.addEventListener("mouseleave", resume);
        hero.addEventListener("focusin", function (e) { if (e.target.matches(":focus-visible")) pause(); });
        hero.addEventListener("focusout", function () { setTimeout(function () { if (!hero.contains(document.activeElement)) resume(); }, 0); });
        document.addEventListener("visibilitychange", function () { if (document.hidden) pause(); else resume(); });

        document.getElementById("heroPrev").addEventListener("click", function () { go(current - 1, true); });
        document.getElementById("heroNext").addEventListener("click", function () { go(current + 1, true); });
        hero.addEventListener("keydown", function (e) {
            if (e.key === "ArrowLeft") { go(current - 1, true); } else if (e.key === "ArrowRight") { go(current + 1, true); }
        });

        /* swipe on touch screens */
        hero.addEventListener("touchstart", function (e) { touchX = e.touches[0].clientX; }, { passive: true });
        hero.addEventListener("touchend", function (e) {
            if (touchX === null) return;
            var dx = e.changedTouches[0].clientX - touchX; touchX = null;
            if (Math.abs(dx) > 50) go(current + (dx < 0 ? 1 : -1), true);
        }, { passive: true });

        /* same fade-out the tiles use when opening a story */
        stage.addEventListener("click", function (e) {
            var a = e.target.closest(".hero-slide");
            if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === "_blank" || !/^https?:$/.test(a.protocol)) return;   /* new-tab, mailto: and tel: links keep their normal behaviour */
            e.preventDefault(); document.body.classList.add("leaving");
            setTimeout(function () { location.href = a.href; }, 280);
        });
        window.addEventListener("pageshow", function (e) { if (e.persisted) document.body.classList.remove("leaving"); });

        /* hide the banner while the visitor is searching */
        var box = document.getElementById("search");
        if (box && window.MutationObserver) {
            new MutationObserver(function () { var s = box.classList.contains("has-text"); if (s) { pause(); } hero.style.display = s ? "none" : ""; if (!s) resume(); })
                .observe(box, { attributes: true, attributeFilter: ["class"] });
        }

        if (window.EMP_PROMOS) EMP_PROMOS.applyLabel("newsBanner", document.querySelector("#hero .hero-label"));   /* label text comes from promos.js (LABELS) */
        /* get the promos first (instant when the slot is empty), then draw the banner */
        (window.EMP_PROMOS ? EMP_PROMOS.resolve("newsBanner") : Promise.resolve([])).then(function (list) { promoItems = list; build(); }, function () { build(); });
    })();
    </script>
