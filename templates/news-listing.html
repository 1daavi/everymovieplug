<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>{{TITLE}}</title>
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@everymovieplug">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESC}}">
    <meta name="twitter:image" content="https://everymovieplug.com/twitter-card.jpg">
    <meta name="description" content="{{DESC}}">
    <link rel="canonical" href="{{CANON}}">
    {{PREVNEXT}}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Every Movie Plug">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESC}}">
    <meta property="og:url" content="{{CANON}}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/articles/style.css">
    <style>
        :root { --accent: #a855f7; --accent-soft: rgba(168, 85, 247, .45); --card: rgba(255, 255, 255, .04); --edge: rgba(255, 255, 255, .12); }
        html { background: #000; }
        body { padding: 24px 20px 0; max-width: 1280px; margin: 0 auto; min-height: 100vh; transition: opacity .25s ease; }
        body.leaving { opacity: 0; }

        .top-link{display:inline-flex;align-items:center;gap:.4rem;color:#c4b5fd;text-decoration:none;font-size:.8rem;font-weight:600;padding:.45rem .9rem;border-radius:9999px;border:1px solid rgba(168,85,247,.35);background:rgba(168,85,247,.1);white-space:nowrap;transition:transform .3s cubic-bezier(.16,1,.3,1),background .3s;margin-bottom:28px;}
        .top-link:hover,.top-link:focus-visible{transform:translateX(-3px);background:rgba(168,85,247,.2);color:#c4b5fd}
        .top-link:active{transform:scale(.96);transition-duration:.12s}


        .news-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 32px; }
        .news-head h1 { font-size: clamp(2rem, 4vw, 2.75rem); font-weight: 800; line-height: 1.15; background: linear-gradient(180deg, #fff 0%, #a1a1a6 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .news-head p { color: var(--muted); margin-top: 6px; font-size: 1.05rem; }

        /* Search */
        .search { position: relative; width: min(100%, 380px); }
        .search svg.lens { position: absolute; left: 16px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; transition: color .2s ease; }
        .search input { width: 100%; padding: 13px 44px 13px 44px; border-radius: 9999px; border: 1px solid var(--edge); background: var(--card); color: var(--heading); font: inherit; font-size: .95rem; outline: none; -webkit-appearance: none; appearance: none; transition: border-color .25s ease, box-shadow .25s ease, background .25s ease; }
        .search input::placeholder { color: var(--muted); }
        .search input::-webkit-search-cancel-button { display: none; }
        .search input:focus { border-color: var(--accent-soft); background: rgba(255, 255, 255, .07); box-shadow: 0 0 0 4px rgba(168, 85, 247, .15), 0 0 28px rgba(168, 85, 247, .2); }
        .search:focus-within svg.lens { color: #c4b5fd; }
        .search .clear { position: absolute; right: 10px; top: 50%; width: 28px; height: 28px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .1); color: var(--heading); font-size: 1.1rem; line-height: 1; cursor: pointer; transform: translateY(-50%) scale(.6); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease, background .2s ease; }
        .search.has-text .clear { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
        .search .clear:hover { background: rgba(255, 255, 255, .22); }
        .result-count { color: var(--muted); font-size: .85rem; margin: -16px 0 20px; min-height: 1.2em; }

        /* Tile grid: 4 per row */
        .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
        .tile { position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; border: 1px solid var(--edge); background: var(--surface); color: inherit; text-decoration: none; isolation: isolate; -webkit-tap-highlight-color: transparent;
                transition: transform .35s cubic-bezier(.2, .8, .2, 1), border-color .35s ease, box-shadow .35s ease;
                animation: tile-in .6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
        .tile[hidden] { display: none; }
        .tile.pop { animation: tile-pop .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--j, 0) * 45ms); }
        @keyframes tile-in { from { opacity: 0; transform: translateY(26px) scale(.97); } to { opacity: 1; transform: none; } }
        @keyframes tile-pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }

        .tile-thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: linear-gradient(135deg, #1b1033, #0b0b12 60%, #2a1250); }
        .tile-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .7s cubic-bezier(.2, .8, .2, 1), filter .4s ease; }
        .tile-thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(17, 17, 22, .85)); pointer-events: none; }
        .tile-tag { position: absolute; z-index: 1; top: 12px; left: 12px; padding: 4px 10px; border-radius: 9999px; background: rgba(0, 0, 0, .6); border: 1px solid rgba(255, 255, 255, .2); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #e9d5ff; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

        .tile-body { display: flex; flex-direction: column; flex: 1; padding: 16px 18px 18px; }
        .tile-date { color: var(--muted); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
        .tile-title { margin: 6px 0 8px; font-size: 1.05rem; line-height: 1.35; font-weight: 700; color: var(--heading); transition: color .25s ease; }
        .tile-excerpt { color: var(--muted); font-size: .88rem; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .tile-more { display: inline-flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 14px; color: #c4b5fd; font-size: .82rem; font-weight: 600; }
        .tile-more svg { width: 16px; height: 16px; transition: transform .3s ease; }

        /* shine sweep */
        .tile::before { content: ""; position: absolute; z-index: 2; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .13), transparent); transform: skewX(-18deg); pointer-events: none; }

        @media (hover: hover) {
            .tile:hover { transform: translateY(-8px); border-color: var(--accent-soft); box-shadow: 0 18px 40px rgba(0, 0, 0, .6), 0 0 34px rgba(168, 85, 247, .22); }
            .tile:hover .tile-thumb img { transform: scale(1.09); filter: brightness(1.08) saturate(1.1); }
            .tile:hover .tile-title { color: #fff; }
            .tile:hover .tile-more svg { transform: translateX(5px); }
            .tile:hover::before { left: 130%; transition: left .9s ease; }
        }
        .tile:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 3px; transform: translateY(-4px); }

        /* click: press-down + ripple */
        .tile:active { transform: scale(.965); transition-duration: .12s; }
        .tile.go { animation: tile-go .32s ease forwards; }
        @keyframes tile-go { 0% { transform: scale(.965); } 100% { transform: scale(1.04); opacity: .0; } }
        .ripple { position: absolute; z-index: 3; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: rgba(196, 181, 253, .55); pointer-events: none; animation: ripple .6s ease-out forwards; }
        @keyframes ripple { to { transform: scale(30); opacity: 0; } }

        .empty { display: none; text-align: center; padding: 70px 20px; color: var(--muted); }
        .empty.show { display: block; animation: tile-pop .4s ease both; }
        .empty strong { display: block; color: var(--heading); font-size: 1.2rem; margin-bottom: 6px; }

        .site-footer { max-width: 760px; }

        @media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 820px)  { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; } }
        @media (max-width: 520px)  { body { padding: 14px 12px 0; } .tiles { grid-template-columns: 1fr; } .search { width: 100%; } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
        }

        /* ===== Featured banner ===== */
        .hero { position: relative; margin-bottom: 36px; border-radius: 24px; border: 1px solid var(--edge); background: #0b0b12; overflow: hidden; isolation: isolate; box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 60px rgba(168,85,247,.10); }
        .hero[hidden] { display: none; }
        .hero-label { position: absolute; z-index: 5; top: 18px; left: 22px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 9999px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.16); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #e9d5ff; font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        .hero-label i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: hero-pulse 2s ease-in-out infinite; }
        @keyframes hero-pulse { 50% { opacity: .35; transform: scale(.75); } }

        .hero-stage { display: grid; }
        .hero-slide { grid-area: 1 / 1; position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; gap: 44px; padding: 72px 56px 80px; min-height: 460px; color: inherit; text-decoration: none; opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s linear .7s; -webkit-tap-highlight-color: transparent; }
        .hero-slide.active { opacity: 1; visibility: visible; transition: opacity .7s ease, visibility 0s; z-index: 2; }

        .hero-bg { position: absolute; inset: -40px; z-index: -2; background-size: cover; background-position: center; filter: blur(46px) saturate(1.4) brightness(.55); transform: scale(1.15); }
        .hero-slide::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, rgba(8,6,16,.92) 0%, rgba(8,6,16,.62) 55%, rgba(8,6,16,.35) 100%); }

        .hero-copy { max-width: 560px; transform: translateY(14px); opacity: 0; transition: transform .8s cubic-bezier(.2,.8,.2,1) .15s, opacity .8s ease .15s; }
        .hero-slide.active .hero-copy { transform: none; opacity: 1; }
        .hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
        .hero-tag { padding: 4px 11px; border-radius: 9999px; background: rgba(168,85,247,.22); border: 1px solid rgba(168,85,247,.5); color: #e9d5ff; font-size: .7rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
        .hero-date { color: rgba(255,255,255,.65); font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; }
        .hero-title { font-size: clamp(1.55rem, 3.2vw, 2.55rem); line-height: 1.16; font-weight: 800; color: #fff; letter-spacing: -.015em; text-wrap: balance; }
        .hero-excerpt { margin-top: 14px; color: rgba(255,255,255,.76); font-size: 1rem; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-cta { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; padding: 11px 20px; border-radius: 9999px; background: var(--accent); color: #fff; font-size: .88rem; font-weight: 700; box-shadow: 0 8px 24px rgba(168,85,247,.4); transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, background .3s ease; }
        .hero-cta svg { width: 16px; height: 16px; transition: transform .3s ease; }

        .hero-thumb { position: relative; justify-self: end; width: 100%; max-width: 520px; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); background: linear-gradient(135deg, #1b1033, #0b0b12 60%, #2a1250); box-shadow: 0 22px 50px rgba(0,0,0,.6), 0 0 40px rgba(168,85,247,.2); transform: translateX(26px) scale(.96); opacity: 0; transition: transform .9s cubic-bezier(.2,.8,.2,1) .1s, opacity .9s ease .1s; }
        .hero-slide.active .hero-thumb { transform: none; opacity: 1; }
        .hero-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
        .hero-thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(8,6,16,.5)); pointer-events: none; }

        @media (hover: hover) {
            .hero-slide:hover .hero-cta { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(168,85,247,.55); background: #b36bf8; }
            .hero-slide:hover .hero-cta svg { transform: translateX(5px); }
            .hero-slide:hover .hero-thumb img { transform: scale(1.05); }
        }
        .hero-slide:focus-visible { outline: 2px solid #c4b5fd; outline-offset: -4px; }

        /* controls */
        .hero-nav { position: absolute; z-index: 6; left: 0; right: 0; bottom: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; pointer-events: none; }
        .hero-dots { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 9999px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.14); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); pointer-events: auto; }
        .hero-dot { position: relative; width: 10px; height: 10px; padding: 0; border: 0; border-radius: 9999px; background: rgba(255,255,255,.35); cursor: pointer; overflow: hidden; transition: width .4s cubic-bezier(.2,.8,.2,1), background .3s ease; }
        .hero-dot::before { content: ""; position: absolute; inset: -10px; } /* bigger tap target */
        .hero-dot:hover { background: rgba(255,255,255,.65); }
        .hero-dot.active { width: 34px; background: rgba(255,255,255,.28); }
        .hero-dot i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: #fff; border-radius: inherit; }
        .hero-dot.active i { animation: hero-fill var(--dur, 6s) linear forwards; }
        .hero.paused .hero-dot.active i { animation-play-state: paused; }
        .hero.static .hero-dot.active i { animation: none; transform: scaleX(1); }
        @keyframes hero-fill { to { transform: scaleX(1); } }
        .hero-dot:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 3px; }

        .hero-arrow { pointer-events: auto; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; cursor: pointer; transition: background .25s ease, transform .25s ease; }
        .hero-arrow svg { width: 18px; height: 18px; }
        .hero-arrow:hover { background: rgba(168,85,247,.55); transform: scale(1.08); }
        .hero-arrow:active { transform: scale(.94); }
        .hero-arrow:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 3px; }

        @media (max-width: 900px) {
            .hero-slide { grid-template-columns: 1fr; gap: 22px; padding: 64px 26px 78px; min-height: 0; }
            .hero-thumb { order: -1; justify-self: stretch; max-width: none; transform: translateY(16px); }
            .hero-copy { max-width: none; }
        }
        @media (max-width: 520px) {
            .hero { border-radius: 18px; margin-bottom: 26px; }
            .hero-label { top: 14px; left: 14px; }
            .hero-slide { padding: 58px 16px 72px; }
            .hero-excerpt { -webkit-line-clamp: 2; font-size: .94rem; }
            .hero-arrow { display: none; }
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4564573478126357"
     crossorigin="anonymous"></script>
    {{SCHEMA}}
</head>
<body>
    {{SITENAV}}

    {{HERO}}

    <header class="news-head">
        <div>
            <h1>{{H1}}</h1>
            <p>{{SUBTITLE}}</p>
        </div>
        <div class="search" id="search" role="search">
            <svg class="lens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Search news…" aria-label="Search news" autocomplete="off" spellcheck="false">
            <button class="clear" id="clear" type="button" aria-label="Clear search">&times;</button>
        </div>
    </header>
    <p class="result-count" id="count" aria-live="polite"></p>

    <main>
        {{LIST}}<div class="empty" id="empty"><strong>No stories found</strong>Try a different title, show or keyword.</div>
        {{PAGER}}
        {{TEXT}}
    </main>

    {{FOOTER}}

    {{SEARCH_SCRIPT}}
    {{HERO_SCRIPT}}
</body>
</html>
